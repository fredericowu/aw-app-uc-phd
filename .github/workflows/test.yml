name: Test

# Push/PR-triggered gates, all blocking:
#   1. aw-app.json validates against aw-marketplace's canonical schema.
#   2. pytest with a hard 100% coverage gate, scoped to uc_phd_app (the
#      narrowing and its reason live in pyproject.toml — read it before
#      changing the --cov target here).
#   3. `npm run build` leaves ui/dist byte-identical to what is committed.
#
# Gate 3 is not garnish. ui/dist IS committed, because the shared release
# workflow ships the repo as-is and never builds the frontend — so a commit
# that changes ui/src without rebuilding produces an app whose UI is silently
# a version behind, with nothing anywhere reporting it.
#
# runs-on is ubuntu-latest, not the [self-hosted, aw-baremetal] pair this
# repo used under tekflox, and that is load-bearing twice over:
#   1. Those runners live in tekflox org runner group 3 (aw-private), and a
#      GitHub org runner group can only be shared with repos IN that org.
#      This repo is owned by a personal account, so it can never be added.
#      The jobs would not fail — they would queue forever, which reads as
#      "still running" rather than "gone".
#   2. The `pull_request:` trigger below is unqualified, so now that this
#      repo is public anyone can open one from a fork. Fork PR + self-hosted
#      runner is arbitrary code execution on the bare-metal host that runs
#      the whole workspace: checkout fetches the stranger's branch and
#      pytest runs it. GitHub-hosted runners are disposable VMs with a
#      read-only token, which is the configuration that makes an open
#      `pull_request:` trigger safe. They are also free and unmetered on a
#      public repo — going public is what pays for this.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        # requirements.txt carries the scraper's own deps, which
        # tests/test_parse.py and tests/test_detail_parser.py import.
        run: |
          pip install -r requirements.txt -r requirements-dev.txt \
            pytest jsonschema fastapi httpx uvicorn
      # tests/validate_manifest.py falls back to a sibling aw-marketplace
      # checkout for the canonical schema when this repo has no local
      # schemas/ copy (by design — a vendored copy is how 28 drifted copies
      # happened). actions/checkout refuses a `path` that escapes
      # $GITHUB_WORKSPACE, so a true sibling isn't possible on a runner:
      # check it out into a subdirectory and point --schema at it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tekflox/aw-marketplace
          path: .aw-marketplace-schema
      - name: Validate manifest
        run: python3 tests/validate_manifest.py aw-app.json --schema .aw-marketplace-schema/schemas/aw-app.schema.json
      - name: Test suite + coverage gate
        # fail_under is read from pyproject.toml's [tool.coverage.report].
        run: |
          pytest --cov=uc_phd_app --cov-report=term-missing \
            --cov-report=html --cov-report=xml tests/ -q
      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30

  ui-dist-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5
        with:
          node-version: "24"
      - name: Build the SPA
        working-directory: ui
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Fail if the committed ui/dist is stale
        run: |
          if ! git diff --quiet -- ui/dist; then
            echo "::error::ui/dist is out of date. Run 'npm run build' in ui/ and commit the result."
            git --no-pager diff --stat -- ui/dist
            exit 1
          fi
          echo "ui/dist matches a fresh build."
