# Release into the PUBLIC catalog, tekflox/aw-marketplace.
#
# This is now push-triggered, like every other app. One of the three blockers
# that kept it workflow_dispatch-only is fixed upstream; the other two are the
# same single credential question, and it is still Frederico's.
#
#   1. THE RUNNER — SOLVED (2026-09-25, card
#      3e65bf3b-9510-814d-b49e-d0a61520cd0b). aw-marketplace's reusable
#      app-release.yml no longer hardcodes `runs-on: [self-hosted,
#      aw-baremetal]`. It derives the runner from the CALLER's owner, so this
#      personally-owned repo gets `ubuntu-latest` and every tekflox/* app keeps
#      the byte-identical self-hosted pair it had. Nothing here opts in; there
#      is no runs_on input to pass. The old failure mode — a job queued forever
#      against an org runner group a personal account can never join — is gone,
#      verified by a dispatch run that picked up a runner and started.
#
#   2. THE SECRET DELIVERY — SOLVED (2026-09-25), and the fix corrects a
#      wrong assumption this comment used to make. `secrets: inherit` does
#      NOT forward a caller's repo secrets to a reusable workflow owned by a
#      DIFFERENT organization/account — verified live: with the repo secret
#      present, a dispatch through `inherit` still reached the preflight
#      with an empty token. GitHub scopes `inherit` to same-org/enterprise
#      callers only. Passing the secret explicitly below (same shape
#      aw-app-template already uses) is not a style choice, it is the only
#      shape that works for a personal-account caller. MARKETPLACE_SYNC_TOKEN
#      still has to exist as a repo secret on fredericowu/aw-app-uc-phd.
#
#   3. WHAT THAT SECRET WOULD HAVE TO BE ABLE TO DO — STILL FREDERICO'S CALL.
#      Push a branch to, and open a PR on, tekflox/aw-marketplace — i.e. write
#      access to a TekFlox org repo, stored inside a repo he owns personally.
#      Nothing has been minted, stored or widened to make this workflow pass.
#      If he wants it green, the smallest safe shape is a FINE-GRAINED PAT
#      scoped to tekflox/aw-marketplace (Contents: write, Pull requests: write)
#      plus this repo (Contents: write) — far narrower than a full-scope
#      admin:org / delete_repo PAT.
#
# WHAT A PUSH DOES UNTIL THAT SECRET EXISTS: a RED run, failing on the called
# workflow's first step, whose error names this repo, the secret, where to put
# it and the PAT shape above. That is a deliberate trade and it reverses the
# earlier call in this very file, which chose dispatch-only so master would not
# "sit permanently red and teach everyone here to ignore red CI". The fear was
# runs failing for reasons nobody can act on; this one names exactly one action
# in its own error message. The alternative — staying silent — is what let this
# app's catalog entry sit at v0.1.1 for months while the repo reached v0.6.0,
# so `marketplace install --update` kept reinstalling the ancient version.
# Reversible in one line: delete the `push:` trigger below.
#
# Not a blocker, and actually the behaviour we want: the reusable workflow's
# auto-merge step is gated on `startsWith(github.repository, 'tekflox/')`,
# which this repo does not match. So a sync PR opens and waits for a human. For
# a catalog every workspace in the world reads, a human gate on a non-org
# contributor is correct. Do not try to defeat it.
#
# Backstop, independent of all of the above: aw-marketplace's own weekly
# catalog-drift.yml compares every apps.json entry against its repo's latest
# tag and opens one issue for anything behind — so a release that silently
# stops working again gets noticed in a week, not in months, whatever the cause.

name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force bump kind"
        type: choice
        options: [major]

jobs:
  release:
    # Moving ref: bumping app-release.yml in aw-marketplace propagates here
    # automatically. Move to @v1 once aw-marketplace cuts a first tag.
    #
    # permissions here is the CEILING the called workflow's own
    # `contents: write` request is checked against — this repo's default
    # workflow permissions are read-only, so without this the run fails at
    # startup (startup_failure, zero jobs) before ever reaching aw-marketplace.
    permissions:
      contents: write
    uses: tekflox/aw-marketplace/.github/workflows/app-release.yml@master
    with:
      bump: ${{ inputs.bump || '' }}
      catalog_repo: tekflox/aw-marketplace
    secrets:
      MARKETPLACE_SYNC_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
