[tool.pytest.ini_options]
# tests/ imports `tests.conftest` for the fixture-DB builder, so the repo root
# has to be importable as a package root.
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# DELIBERATE NARROWING — read this before "fixing" it.
#
# aw-app-template measures `--cov=template_app`, its whole repo. This repo has
# four Python packages, and only one of them is the app:
#
#   uc_phd_app/             the app. Runs inside the workspace, on every
#                            request. 100%.
#   scraper/                a network-bound one-shot CLI (`python -m
#                            scraper.run`) that talks to a live website over
#                            HTTP for ~10 minutes. Its parsers already have
#                            fixture-based tests (tests/test_parse.py,
#                            tests/test_detail_parser.py); its fetch/retry/
#                            pagination paths cannot be covered without
#                            either hitting cisuc.uc.pt from CI or building a
#                            mock HTTP site whose only reader is the mock
#                            itself.
#   estudo_geral_extractor/ same shape, same reasoning, different site
#                            (estudogeral.uc.pt, OAI-PMH + a cookie-gated
#                            bitstream download). Its pure parsing/selection
#                            functions have fixture-based tests
#                            (tests/test_estudo_geral_extractor.py); its
#                            network paths do not.
#   analysis/               offline build steps (`python -m
#                            analysis.build_thesis_facts`) whose output is
#                            committed into the seed. Not network-bound like
#                            the two above — it is excluded for the other
#                            reason: it does not run in production at all.
#                            It is nonetheless the most heavily tested code
#                            in the repo, because name_match.py is replayed
#                            against 50 hand-verified decisions
#                            (tests/test_name_match.py) and the builder
#                            against a fixture corpus
#                            (tests/test_build_thesis_facts.py). Coverage was
#                            100% of both modules when they landed; the gate
#                            below is not what holds them, the golden fixture
#                            is.
#
# Holding either one-shot CLI to 100% would therefore buy fake tests, and
# lowering the gate to accommodate them would drop the floor for the code
# that actually runs in production. So the gate stays at 100% and the scope
# is the app package. If a future change moves real app logic into either
# CLI package, move the boundary with it rather than quietly lowering the
# number.
source = ["uc_phd_app"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
# Exemptions 1-4 from docs/standards/pipeline-testing.md §3 (glue, properties,
# dunder reprs, pure re-exports), inherited from aw-app-template.
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "def __main__",
    "if __name__ == .__main__",
    "raise NotImplementedError",
    "except ImportError",
]
show_missing = true
precision = 1
# Hard 100% gate on uc_phd_app, matching the template this app was born from.
# Never lower this without writing the reason next to it.
fail_under = 100
